name: run-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this file so a tag is tested by exactly the CI
  # that main runs, not by a second copy of the commands.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The wheel is py3-none, so one compiled library serves every
        # interpreter; the matrix runs the pure-Python and the compiled paths
        # against every interpreter the metadata claims.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: uv pip install -e . --group dev
      - name: Pre-commit
        if: matrix.python-version == '3.13'
        run: uv run pre-commit run --all-files
        env:
          SKIP: rustfmt
      - name: Tests
        run: uv run pytest -q

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S kernel -B build/cpp -DDETREE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/cpp -j4
      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure

  sanitizers:
    # The C++ machine is the porting reference, so undefined behavior there is
    # worth catching even though the release ships Rust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: >
          cmake -S kernel -B build/sanitize -DDETREE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/sanitize -j4
      - name: Test
        run: ctest --test-dir build/sanitize --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path kernel/rust/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --manifest-path kernel/rust/Cargo.toml
      - name: Build
        run: cargo build --manifest-path kernel/rust/Cargo.toml --release

  conformance:
    # Three machines, one suite. The install builds both compiled libraries and
    # the tests are run through the venv directly: `uv run` re-syncs the
    # editable install to the Rust-only default, after which the `[cpp]` cases
    # skip instead of fail and a green run proves nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install both machines
        run: >-
          DETREE_SHIP_BACKEND=both uv pip install -e . --group dev
          --reinstall-package detree-vm
      - name: Both libraries are installed
        # A skipped backend is not a passing backend, so fail here rather than
        # read a green suite that only ran the Python reference.
        run: >-
          .venv/bin/python -c "import sys; from detree.abi.libs import library_path;
          missing = [n for n in ('cpp', 'rust') if library_path(n) is None];
          sys.exit(f'missing compiled machine: {missing}' if missing else 0)"
      - name: Backend identity
        run: .venv/bin/python -m pytest -q tests/test_backends.py
      - name: Python reference
        run: DETREE_BACKEND=python .venv/bin/python -m pytest -q -rs
      - name: C++ machine
        run: DETREE_BACKEND=cpp .venv/bin/python -m pytest -q -rs
      - name: Rust machine
        run: DETREE_BACKEND=rust .venv/bin/python -m pytest -q -rs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
      - name: Install the documentation toolchain
        run: uv pip install --group docs
      - name: ISA tables
        run: python3 tools/gen_isa.py --check
      - name: Optimizer document
        run: python3 tools/gen_opt.py --check
      - name: Documentation
        run: python3 tools/check_docs.py
      - name: Golden corpus
        run: python3 tools/golden.py --check
      # The deploy workflow publishes this build, so a broken page has to fail
      # the pull request instead of the release. `-W` is the same flag.
      - name: Build the site
        run: >-
          .venv/bin/sphinx-build -b html -c docs -d build/docs/doctrees -W
          docs build/docs/html

  package:
    # The release artifact is part of the product: build it on every change and
    # check the wheel contract (one Rust library, the C header, a py3-none tag)
    # before a tag ever exists.
    #
    # Skipped on a tag: `release.yml` builds the four artifacts it publishes and
    # its `inspect` job runs the same contract checks, so a wheel built here
    # would never be shipped and would only repeat the work.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          uv build --wheel --out-dir dist
          uv build --sdist --out-dir dist
      - name: Wheel contract
        run: python3 tools/inspect_wheel.py dist/*.whl
      - name: Sdist carries the build sources
        run: |
          tar -tzf dist/*.tar.gz > sdist.txt
          for path in kernel/cpp/CMakeLists.txt kernel/rust/src/lib.rs kernel/rust/Cargo.toml spec/isa.toml; do
            grep -q "/$path$" sdist.txt || { echo "missing $path"; exit 1; }
          done
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/detree-wheel
          uv pip install --python /tmp/detree-wheel/bin/python --no-deps \
            --find-links dist --prerelease=allow detree-vm
          uv pip install --python /tmp/detree-wheel/bin/python numpy
          /tmp/detree-wheel/bin/python -m detree backends
