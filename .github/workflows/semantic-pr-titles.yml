name: Lint PR

# `pull_request`, not `pull_request_target`: from 2026-12-02 GitHub blocks the
# target trigger by default in public repositories, and this check only reads
# the event payload, so it needs neither the base checkout nor a secret.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # The title becomes the squash commit subject, so it is held to the same
      # Conventional Commits rule as a hand-written commit (CONTRIBUTING.md).
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
