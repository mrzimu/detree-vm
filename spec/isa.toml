flags = ["string", "pure"]
group = "string"
name = "STR_EQ"
operands = "rd, ra, rb"
reads = ["ra", "rb"]
summary = "String equality, 0 or 1."
writes = ["rd"]

[[op]]
code = 0xB2
flags = ["string", "state"]
group = "string"
name = "STR_STORE"
operands = "SLOT, ra"
reads = ["ra"]
summary = "Store a string id in a name slot."
writes = []

[[op]]
code = 0xB3
flags = ["string", "state", "pure"]
group = "string"
name = "STR_LOAD"
operands = "rd, SLOT"
reads = []
summary = "Load a string id from a name slot."
writes = ["rd"]

[[op]]
code = 0xC0
flags = ["verify", "can_trap"]
group = "verify"
name = "ASSERT"
operands = "ra, MSG"
reads = ["ra"]
summary = "Fail unless ra is nonzero."
writes = []

[[op]]
code = 0xC1
flags = ["verify", "can_trap"]
group = "verify"
name = "ASSERT_CURSOR_EQ"
operands = "ra, MSG"
reads = ["ra"]
summary = "Fail unless the cursor equals ra."
writes = []

[[op]]
code = 0xC2
flags = ["verify", "can_trap"]
group = "verify"
name = "ASSERT_STR_EQ"
operands = "ra, rb, MSG"
reads = ["ra", "rb"]
summary = "Fail unless two string ids are equal."
writes = []

[[op]]
code = 0xC3
flags = ["verify", "terminator", "can_trap"]
group = "verify"
name = "THROW"
operands = "MSG"
reads = []
summary = "Raise an unconditional decoder error."
writes = []

