# Detree ISA v0.2 — machine-readable opcode table.
#
# This file is the single source of truth for opcode numbers, operand shapes,
# register reads/writes, and instruction flags. `tools/gen_isa.py --check`
# validates it against the Python, C++, and Rust tables and the Markdown mirror;
# `--write` regenerates the operand table the disassembler reads. Do not edit
# generated files by hand.
#
# Operand notation:
# rd, ra, rb     register numbers (0..255)
# IMM            signed 64-bit immediate in imm1
# LBL            absolute instruction index in imm1
# BUF            buffer id in imm1
# SLOT           state slot id in imm1
# FUNC           function id in imm1
# LAYOUT         layout id in imm1
# MSG            string id in imm1
# CONST          string constant id in imm1
# TC             typecode in imm1
# ra, rb, LBL    the target is in imm2 for three-operand branches
#
# Flags:
# terminator     ends a basic block
# jump           unconditional control transfer
# branch         conditional control transfer
# call           inter-function call
# stream         reads or moves the stream cursor
# bulk           reads more than one element in one instruction
# buffer         mutates or reads a buffer
# state          mutates or reads a state slot
# ref            mutates or reads the reference table
# string         allocates or compares interned strings
# verify         may raise an assertion or execution error
# can_trap       may raise a runtime error (division by zero, bounds, ...)
# pure           no side effects; may be removed when its result is dead
# debug          debug-only; may be removed from a release module

[buffer_kinds]
DATA = 0
OFFSETS = 1

[field_kinds]
ARRAY_FIXED = 2
SCALAR = 0
SKIP = 1
TOBJECT_SKIP = 3

[meta]
instruction_size = 20
isa_major = 0
isa_minor = 2
magic = "DETR"

